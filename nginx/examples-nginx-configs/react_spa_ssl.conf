# Copy this config file to `/sites-available` directory and edit as needed.
# Update `example.com` with your domain name.
server {
  listen 80;
  server_name example.com;
  return 301 https://example.com$request_uri;
}

server {
  listen  443 ssl;
  http2   on;
  # If you have Let's Encrypt SSL you just need to update the domain name in 2 lines below
  ssl_certificate        /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key    /etc/letsencrypt/live/example.com/privkey.pem;

  server_name example.com;

  # Gzip for JS/CSS/JSON: nginx.conf has `gzip on`, but the default gzip_types is text/html only,
  # so app bundles and API responses would go out uncompressed (a 1.4 MB JS bundle -> ~400 KB with gzip).
  gzip            on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied    any;
  gzip_vary       on;
  gzip_types      text/css text/plain text/javascript application/javascript application/json image/svg+xml;

  # root below points to /public folder through docker-compose.yml volumes
  # Any change in /public folder will be visible outside in the browser immediately!
  root /usr/share/nginx/html;

  # Hashed build assets (Vite: /assets/, CRA: /static/) never change under the same name -> cache for a year
  location /assets/ {
    root /usr/share/nginx/html/example-spa-react;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html must not be cached, otherwise users keep loading old bundle names after a deploy
  location = /index.html {
    root /usr/share/nginx/html/example-spa-react;
    add_header Cache-Control "no-cache";
  }

  location / {
    root /usr/share/nginx/html/example-spa-react;
    try_files $uri /index.html;
  }
}
